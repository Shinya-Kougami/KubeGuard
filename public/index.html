<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeGuard - DevSecOps Telemetry</title>
    <!-- Tipografía corporativa moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1A1A1A;
            --accent-gold: #F2C94C;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --border-color: #333333;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Montserrat', sans-serif; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard { 
            width: 100%;
            max-width: 850px; 
            padding: 2rem; 
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 1.5rem; 
            margin-bottom: 2.5rem; 
        }
        .header h1 { 
            margin: 0; 
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 span { 
            color: var(--accent-gold); 
        }
        .status-badge { 
            background-color: transparent; 
            color: var(--accent-gold); 
            padding: 6px 18px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 0.85rem; 
            border: 1px solid var(--accent-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 1.5rem; 
        }
        .card { 
            background-color: var(--card-bg); 
            padding: 2rem; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            text-align: left; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }
        .card h3 { 
            margin: 0 0 10px 0; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
        }
        .card p { 
            font-size: 2.5rem; 
            margin: 0; 
            font-weight: 600; 
            color: var(--text-main); 
        }
        .card p span.unit {
            font-size: 1rem;
            color: var(--text-muted);
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>Kube<span>Guard</span></h1>
            <div id="status" class="status-badge">CONECTANDO...</div>
        </div>
        
        <div class="card-grid">
            <div class="card">
                <h3>Uso de CPU</h3>
                <p><span id="cpu">--</span><span class="unit">%</span></p>
            </div>
            <div class="card">
                <h3>Uptime del Servicio</h3>
                <p><span id="uptime">--</span><span class="unit">s</span></p>
            </div>
            <div class="card">
                <h3>Memoria RAM Total</h3>
                <p><span id="ram-total">--</span><span class="unit">GB</span></p>
            </div>
            <div class="card">
                <h3>Memoria RAM Libre</h3>
                <p><span id="ram-free">--</span><span class="unit">GB</span></p>
            </div>
        </div>
    </div>

    <script>
        async function fetchMetrics() {
            try {
                // Consulta al backend
                const response = await fetch('/api/metrics');
                if (!response.ok) throw new Error('Respuesta de red fallida');
                
                const data = await response.json();
                const statusEl = document.getElementById('status');
                
                // Mapeo adaptado exactamente a tu JSON
                statusEl.innerText = data.health || 'ONLINE';
                
                if (data.health === 'HEALTHY') {
                    statusEl.style.borderColor = '#4CAF50';
                    statusEl.style.color = '#4CAF50';
                } else {
                    statusEl.style.borderColor = '#F2C94C';
                    statusEl.style.color = '#F2C94C';
                }

                document.getElementById('cpu').innerText = data.cpu.usagePercent;
                
                const totalGB = (data.memory.totalMB / 1024).toFixed(2);
                const freeGB = (data.memory.freeMB / 1024).toFixed(2);
                
                document.getElementById('ram-total').innerText = totalGB;
                document.getElementById('ram-free').innerText = freeGB;
                document.getElementById('uptime').innerText = data.uptimeSeconds;

            } catch (error) {
                const statusEl = document.getElementById('status');
                statusEl.innerText = 'ERROR DE API';
                statusEl.style.borderColor = '#f44336';
                statusEl.style.color = '#f44336';
            }
        }

        // Ejecutar cada 2 segundos
        setInterval(fetchMetrics, 2000);
        fetchMetrics();
    </script>
</body>
</html>
