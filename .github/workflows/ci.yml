name: KubeGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (sintaxis y complejidad ciclomática)
        run: npm run lint

      - name: Pruebas unitarias con cobertura
        run: npm run test:coverage

      # - name: AI Code Review (Agente de IA)
      #   # Integrar un agente de IA para revisión de código, por ejemplo:
      #   # - CodeRabbit (GitHub App): https://coderabbit.ai
      #   # - GitHub Copilot CLI / Copilot code review en pull requests
      #   uses: coderabbitai/ai-pr-reviewer@latest
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t kubeguard:latest .
